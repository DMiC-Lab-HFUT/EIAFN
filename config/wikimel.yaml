run_name: WikiMEL
seed: 43
pretrained_model: 'openai/clip-vit-base-patch32'
lr: 1e-4


data:
  num_entity: 109976
  kb_img_folder: ./dataset/WikiMEL/kb_image
  mention_img_folder: ./dataset/WikiMEL/mention_image
  qid2id: ./dataset/WikiMEL/qid2id.json
  entity: ./dataset/WikiMEL/kb_entity.json
  train_file: ./dataset/WikiMEL/WIKIMEL_train.json
  dev_file: ./dataset/WikiMEL/WIKIMEL_dev.json
  test_file: ./dataset/WikiMEL/WIKIMEL_test.json

  batch_size: 1024
  num_workers: 8
  text_max_length: 40

  eval_chunk_size: 6000
  eval_batch_size: 20
  embed_update_batch_size: 512


model:
  input_hidden_dim: 512
  input_image_hidden_dim: 768
  hidden_dim: 96
  dv: 96
  dt: 512
  TGLU_hidden_dim: 96
  IDLU_hidden_dim: 96
  CMFU_hidden_dim: 96


trainer:
  max_epochs: 20
  early_stopping_patience: 2
